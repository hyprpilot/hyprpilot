---
# Conventional Commits → version-bump table that release-please applies
# (Angular preset, parser-baked):
#
#   `feat: ...`         → minor    (0.1.9 → 0.2.0)
#   `fix: ...`          → patch    (0.1.9 → 0.1.10)
#   `perf: ...`         → patch    (changelog: "Performance" section)
#   `refactor: ...`     → patch    (changelog: "Refactor" section)
#   `docs: ...`         → patch    (changelog: "Documentation" section)
#   `chore/test/ci: ..` → no bump  (hidden in changelog)
#
# To force a major bump from any type, use the `!` suffix or
# `BREAKING CHANGE:` footer:
#
#   `feat!: drop X`     → major    (0.1.9 → 1.0.0)
#   `perf!: replace Y`  → major
#   `fix!: rewire Z`    → major
#   plain commit body containing `BREAKING CHANGE: <text>` → major
#
# The earlier config carried `bump-minor-pre-major: true` +
# `bump-patch-for-minor-pre-major: true` which downshifted EVERY tier
# by one (BREAKING → minor, feat → patch, fix → patch). That's why
# every PR shipped as a patch bump regardless of type — feature merges
# (#22, #20, #26, #30) all landed as 0.1.x increments. Removing the
# flags restores the standard Angular table; pre-1.0 a major bump now
# takes us to 1.0.0 deliberately, not by accident.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # `actions: write` lets the follow-up step dispatch release.yml
  # without a PAT.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN is fine for the action's own work (opening the
          # Release PR, tagging on merge, creating the GitHub Release).
          # The anti-recursion rule blocks the resulting `release:
          # published` event from auto-triggering release.yml — handled
          # by the follow-up step below.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Dispatch release.yml on new release
        # workflow_dispatch is exempt from the anti-recursion rule, so
        # this triggers release.yml even though we're calling it with
        # GITHUB_TOKEN. The checkout above gives `gh` a git context to
        # infer the target repo from.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --ref main -f tag="$TAG"
