---
name: Release

on:
  # `release: published` instead of `push: tags: v*`. release-please
  # creates the tag using GITHUB_TOKEN via the GitHub API, and GitHub's
  # anti-recursion rule blocks token-originated tag pushes from
  # triggering other workflows. Listening on the release event itself
  # bypasses that — it fires when release-please's auto-publish step
  # transitions the release out of draft.
  release:
    types:
      - published
  # Manual escape hatch for retries against an already-published tag
  # (e.g. when build-release fails post-publish or the AUR push errors).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build artifacts + publish AUR for, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Linux x86_64 release tarball
    runs-on: ubuntu-latest
    outputs:
      pkgver: ${{ steps.ver.outputs.pkgver }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve tag (release event vs manual dispatch)
        id: ver
        run: |
          # `release` event → tag rides on github.event.release.tag_name.
          # workflow_dispatch → captain supplies it via inputs.tag.
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "no tag resolved (release.tag_name + inputs.tag both empty)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # Pin to the resolved tag so workflow_dispatch retries build
          # the right commit (default would be `main`'s HEAD).
          ref: ${{ steps.ver.outputs.tag }}
          # Icons under icons/ are tracked via Git LFS (see
          # .gitattributes); without `lfs: true` the runner checks
          # out 130-byte pointer files instead of real PNGs.
          lfs: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            zstd

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install workspace deps
        run: task install

      - name: Build release binary
        run: task release

      - name: Pack tarball
        id: pack
        # Tarball layout matches what `hyprpilot-bin/PKGBUILD` expects
        # — flat `hyprpilot/` dir with the binary, license, desktop
        # entry, icon, and a sample config copy. The captain installing
        # -bin gets the same /usr layout the source-built variants
        # produce.
        run: |
          ARCHIVE="hyprpilot-v${{ steps.ver.outputs.pkgver }}-x86_64-unknown-linux-gnu.tar.zst"
          mkdir -p staging/hyprpilot
          install -Dm755 target/release/hyprpilot staging/hyprpilot/hyprpilot
          install -Dm644 LICENSE staging/hyprpilot/LICENSE
          install -Dm644 README.md staging/hyprpilot/README.md
          install -Dm644 packaging/hyprpilot.desktop staging/hyprpilot/hyprpilot.desktop
          install -Dm644 src/config/defaults.toml staging/hyprpilot/config.example.toml
          for size in 16 32 48 64 128 256 512; do
            install -Dm644 "icons/${size}x${size}.png" \
              "staging/hyprpilot/icons/${size}x${size}.png"
          done
          tar --zstd -cf "$ARCHIVE" -C staging hyprpilot
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        # release-please created the tag + Release; we attach
        # artifacts to the existing Release rather than creating a
        # new one. `tag_name` is explicit so the workflow_dispatch
        # retry path (where `github.ref` is `refs/heads/main`, not
        # the tag) still resolves the correct release.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256

  publish-aur-bin:
    name: Publish hyprpilot-bin (prebuilt) to AUR
    # Depends on build-release so the GH Release tarball exists by
    # the time `updpkgsums` fetches it for the b2sums refresh.
    needs:
      - build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin to the same tag as build-release so the PKGBUILD's
          # release-please-bumped pkgver matches the tarball we just
          # uploaded.
          ref: ${{ needs.build-release.outputs.tag }}

      - name: Push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: hyprpilot-bin
          pkgbuild: packaging/aur/hyprpilot-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "upgpkg: hyprpilot-bin ${{ needs.build-release.outputs.pkgver }}-1"
          # `test: false` — the bin variant package() step would
          # need the binary tarball already on disk inside the action
          # container, which means a network fetch from GH Releases.
          # Skipping the test build saves ~2min per release; the
          # captain who installs `-bin` will surface real issues
          # within hours of release anyway.
          updpkgsums: true
          test: false
          force_push: false
