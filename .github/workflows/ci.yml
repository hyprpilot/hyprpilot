---
name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

# Cancel in-flight runs on the same ref when a new push lands —
# saves CI minutes and surfaces failures from the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Live-adapter smoke tests require Claude / ACP credentials and
# intentionally do NOT run here; captain runs them locally before
# tagging a release. Future tests that need real-agent access follow
# the same opt-in env-var gate convention.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install workspace deps
        run: task install

      - name: Lint
        run: task lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install workspace deps
        run: task install

      - name: Test
        run: task test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install workspace deps
        run: task install

      - name: Build
        run: task build
