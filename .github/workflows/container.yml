---
name: Container

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  # Build only: proves the image still builds without publishing from an
  # unmerged (and possibly forked) head.
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  # release-please dispatches this with the new tag, for the same
  # anti-recursion reason it dispatches release.yml: its token-created
  # tag and release fire no workflow of their own. An empty `tag` builds
  # the dispatched ref like a push would.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish the semver image for, e.g. v3.23.0"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # `git` so `type=sha` names the checked-out tag's commit on a
          # release dispatch, not the tip of the branch it ran from.
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=ref,event=pr
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
