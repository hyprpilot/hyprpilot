[package]
name = "hyprpilot"
description = "Config-driven launcher that resolves a profile and execs the vendor's native agent CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "hyprpilot"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "0.12", features = ["unstable"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
garde = { version = "0.22", features = ["derive"] }
globset = "0.4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shellexpand = "3"
thiserror = "2"
tokio = { version = "1.52", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"
nucleo-picker = "0.11.1"
path-absolutize = "3.1.1"
merge = { version = "0.2.0", features = ["derive"] }
# Skills MCP server. `transport-io` adds the stdio transport on top of the
# default `server` + `macros` + `base64`. Used by `hyprpilot mcp serve`.
rmcp = { version = "1", features = ["transport-io"] }
# Cross-platform OS-level URL / path opener for the `open_url` MCP tool.
# The MCP server runs as a stdio sidecar — this crate wraps `xdg-open`
# on Linux, `open` on macOS, `start` on Windows.
open = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52", features = ["full", "test-util"] }
