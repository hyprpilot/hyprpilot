[package]
name = "hyprpilot"
description = "Config-driven launcher that resolves a profile and execs the vendor's native agent CLI."
version = "3.15.0"
edition = "2021"
license = "MIT"
authors = ["Cenk Kılıç <cenk1cenk2cenk3@gmail.com>"]
repository = "https://github.com/hyprpilot/hyprpilot"

[[bin]]
name = "hyprpilot"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1"
bytesize = "2.4.2"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
garde = { version = "0.23", features = ["derive"] }
globset = "0.4"
# RFC 3339 formatting for the skills server's file timestamps. Already
# compiled into every build as a transitive dep of `rmcp`, so making it
# direct adds no crate and no build time. `clock` is deliberately off —
# nothing here reads the wall clock, it only formats a `SystemTime`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serde_yaml` was archived by its author and publishes as
# `0.9.34+deprecated`. `yaml_serde` is the continuation under
# github.com/yaml/yaml-serde and keeps the same `Value` / `Mapping` /
# `from_str` surface. Same kind of backend, too: it parses via
# `libyaml-rs`, libyaml transpiled by c2rust — the same lineage as the
# `unsafe-libyaml` serde_yaml used, not a switch to C FFI.
yaml_serde = "0.10"
shellexpand = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
# Interactive profile picker. 0.12 matches through `ncp-matcher`, which
# reaches `tinyvec` — whose 1.13.0 does not compile (`vec!` resolves to
# the `alloc::vec` module it imports). Cargo.lock therefore holds
# tinyvec at 1.12.0; drop the pin once 1.13.1 lands or 1.13.0 is yanked.
nucleo-picker = "0.12.1"
path-absolutize = "4.0.1"
merge = { version = "0.2.0", features = ["derive"] }
# Skills MCP server. `transport-io` adds the stdio transport on top of the
# default `server` + `macros` + `base64`. Used by `hyprpilot mcp serve`.
rmcp = { version = "3", features = ["transport-io"] }
# Cross-platform OS-level URL / path opener for the `open_url` MCP tool.
# The MCP server runs as a stdio sidecar — this crate wraps `xdg-open`
# on Linux, `open` on macOS, `start` on Windows.
open = "5"
# Per-session scratch dirs for the MCP agent harness. `TempDir` removes
# the tree on `Drop`, so dropping the session table IS the cleanup — no
# bespoke reaper, no TTL sweep. Also a dev-dependency (test fixtures).
tempfile = "3"
# Process control for harness sessions: `setpgid` (so a kill reaches the
# vendor's own subprocesses, not just the direct child), `SIGTERM` (tokio
# only offers SIGKILL), and `PR_SET_PDEATHSIG` — the kernel-level
# guarantee that a session dies with the sidecar even under SIGKILL or
# the release profile's `panic = "abort"`.
nix = { version = "0.31", features = ["process", "signal"] }
# `CancellationToken` — the type rmcp hands us on `RequestContext.ct`,
# tripped when the client cancels a request. It is what ends an
# unbounded `session_read` follow, so the agent decides when to stop
# watching rather than the server imposing a timer.
tokio-util = "0.7"
# Session handles. A per-table counter made handles collide across
# sidecars (two servers both mint `…-1`), which is harmless only while
# the namespaces never meet — a v4 UUID is unique without coordination.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full", "test-util"] }
