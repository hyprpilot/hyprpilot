---
# https://taskfile.dev

version: "3"

vars:
  # Route node-based commands through `mise exec` so the mise-pinned
  # node 24 + pnpm 10 always run the docs/ build, regardless of which
  # `node` / `pnpm` happens to come first on the developer's PATH
  # (system node, an older pnpm). Matches what CI does — node version
  # mismatches silently let TS errors slip locally that CI then catches.
  pnpm: mise exec -- pnpm

env:
  # Default `RUST_LOG` for every `task` invocation (notably `task run`).
  # The launcher resolves a profile from layered config and `exec()`s
  # into the vendor CLI, so `hyprpilot`'s own tracing only covers the
  # brief resolve phase. `warn` keeps the pre-exec output quiet;
  # `hyprpilot=info` surfaces config-load + resolution breadcrumbs.
  # Captains override per-shell:
  #   RUST_LOG='trace' task run                  # everything at trace
  #   RUST_LOG='warn' task run                   # near-silent
  RUST_LOG: warn,hyprpilot=info

tasks:
  install:
    desc: Install Rust and frontend dependencies.
    cmds:
      - cargo fetch
      - "{{ .pnpm }} install"

  test:
    desc: Run the Rust (cargo-nextest) test suite.
    deps: [test:rust]

  test:rust:
    desc: Run the Rust nextest suite, surfacing every failure (no fail-fast).
    cmds:
      - cargo nextest run --all-targets --no-fail-fast

  format:
    desc: Format Rust and every pnpm package.
    deps: [format:rust, format:node]

  format:rust:
    desc: Run `cargo fmt` across the Rust workspace.
    cmds:
      - cargo fmt --all

  format:node:
    desc: Run the `format` script in every pnpm package that defines one.
    cmds:
      - "{{ .pnpm }} -r --parallel --if-present run format"

  lint:
    desc: Lint Rust and every pnpm package.
    deps: [lint:rust, lint:node]

  lint:rust:
    desc: "`cargo fmt --check` + `cargo clippy` on the Rust workspace."
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets -- -D warnings

  lint:node:
    desc: Run the `lint` script in every pnpm package that defines one.
    cmds:
      - "{{ .pnpm }} -r --parallel --if-present run lint"

  run:
    desc: Build and run the launcher binary.
    cmds:
      - cargo run -- {{ .CLI_ARGS }}

  cli:
    desc: Invoke the built debug binary.
    cmds:
      - ./target/debug/hyprpilot {{ .CLI_ARGS }}

  build:
    desc: Build the debug launcher binary.
    cmds:
      - cargo build

  release:
    desc: Build the release launcher binary.
    cmds:
      - cargo build --release

  docs:dev:
    desc: VitePress dev server for the documentation site.
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run dev"

  docs:build:
    desc: Build the documentation site to docs/.vitepress/dist.
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run build"

  docs:preview:
    desc: Preview the production-built documentation site locally.
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run preview"

  docs:screenshots:
    desc: Capture all documentation screenshots via Playwright (requires UI dev server).
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run screenshots"
