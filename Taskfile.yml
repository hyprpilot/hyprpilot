---
# https://taskfile.dev

version: "3"

vars:
  # Route node-based commands through `mise exec` so the
  # mise-pinned node 24 + pnpm 10.33.4 always run, regardless of
  # which `node` / `pnpm` happens to come first on the developer's
  # PATH (bun's node shim, system node, an older pnpm). Matches
  # what CI does — node version mismatches silently let TS errors
  # slip locally that CI then catches.
  pnpm: mise exec -- pnpm

env:
  # Default `RUST_LOG` for every `task` invocation (notably `task run`).
  # Bare `warn` keeps daemon-wide noise low; per-target `=trace`
  # enables the diagnostic stamps we rely on across the live-event
  # pipeline. Captains override per-shell when they need a tighter
  # or noisier filter:
  #   RUST_LOG='trace' task run                  # everything at trace
  #   RUST_LOG='warn,hyprpilot=info' task run    # near-silent
  #
  # Targets in the default set:
  #   * `hyprpilot=info`        — daemon-wide breadcrumbs (config
  #     load, registry actions, RPC dispatch entries).
  #   * `acp::emit=trace`       — actor → broadcast lifecycle events
  #     (TurnStarted/Ended, UsageUpdate, InstanceMeta, ...).
  #     `acp::emit::chunk` (transcript / terminal) is OFF by default
  #     (~30 lines/sec during streaming); opt in per shell.
  #   * `tauri::emit=trace`     — webview-bound app.emit lifecycle
  #     calls. `tauri::emit::chunk` opt-in.
  #   * `snapshot::mirror=trace` — mirror.apply lifecycle writes.
  #     `snapshot::mirror::chunk` opt-in.
  #   * `snapshot::meta=trace`  — every served meta snapshot RPC.
  #   * `snapshot::chat=trace`  — every served chat-page RPC.
  #   * `acp::wire=trace`,`acp::thought=trace` — raw vendor wire +
  #     thought-extraction outcomes.
  #   * `webview=trace`         — UI-side `log.trace(...)` calls.
  #     tauri-plugin-log targets `webview` / `webview:<file:line>`.
  #     Without this the daemon stderr only shows the Rust half of
  #     the pipeline and a captain debugging UI events sees nothing.
  RUST_LOG: warn,hyprpilot=info,acp::emit=trace,tauri::emit=trace,snapshot::mirror=trace,snapshot::meta=trace,snapshot::chat=trace,acp::wire=trace,acp::thought=trace,webview=trace

tasks:
  install:
    desc: Install Rust and frontend dependencies.
    cmds:
      - cargo fetch
      - "{{ .pnpm }} install"

  test:
    desc: Run the Rust (cargo-nextest) test suite.
    deps: [test:rust]

  test:rust:
    desc: Run the Rust nextest suite, surfacing every failure (no fail-fast).
    cmds:
      - cargo nextest run --all-targets --no-fail-fast

  format:
    desc: Format Rust and every pnpm package.
    deps: [format:rust, format:node]

  format:rust:
    desc: Run `cargo fmt` across the Rust workspace.
    cmds:
      - cargo fmt --all

  format:node:
    desc: Run the `format` script in every pnpm package that defines one.
    cmds:
      - "{{ .pnpm }} -r --parallel --if-present run format"

  lint:
    desc: Lint Rust and every pnpm package.
    deps: [lint:rust, lint:node]

  lint:rust:
    desc: "`cargo fmt --check` + `cargo clippy` on the Rust workspace."
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets -- -D warnings

  lint:node:
    desc: Run the `lint` script in every pnpm package that defines one.
    cmds:
      - "{{ .pnpm }} -r --parallel --if-present run lint"

  run:
    desc: Build and run the launcher binary.
    cmds:
      - cargo run -- {{ .CLI_ARGS }}

  cli:
    desc: Invoke the built debug binary.
    cmds:
      - ./target/debug/hyprpilot {{ .CLI_ARGS }}

  build:
    desc: Build the debug launcher binary.
    cmds:
      - cargo build

  release:
    desc: Build the release launcher binary.
    cmds:
      - cargo build --release

  docs:dev:
    desc: VitePress dev server for the documentation site.
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run dev"

  docs:build:
    desc: Build the documentation site to docs/.vitepress/dist.
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run build"

  docs:preview:
    desc: Preview the production-built documentation site locally.
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run preview"

  docs:screenshots:
    desc: Capture all documentation screenshots via Playwright (requires UI dev server).
    cmds:
      - "{{ .pnpm }} --filter hyprpilot-docs run screenshots"
